[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "on-primes"
version = "0.1.0"
description = "Reference tools for dyadic prime fibres and prime masks"
requires-python = ">=3.11"
authors = [{name = "Adrian Lipa"}]

[tool.setuptools.packages.find]
where = ["src"]
